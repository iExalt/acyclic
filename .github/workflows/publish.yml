name: Publish

# Publishes a `v*` tag: builds it through build.yml, then the GitHub release with the archives, and the server's image
# on GitHub's container registry under the tag and `latest`. A release PR's merge makes the tag; running this by hand
# with a tag publishes it again, such as after a failed run. Only the `release` job can write.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish, such as v1.2.3
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  IMAGE: ghcr.io/iexalt/acyclic-server

jobs:
  tag:
    name: check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: |
          case "$TAG" in v[0-9]*) ;; *) echo "not a release tag: $TAG" >&2; exit 1 ;; esac
          git rev-parse --verify --quiet "refs/tags/$TAG^{commit}"

  build:
    needs: tag
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ inputs.tag || github.ref_name }}
      rehearse: false

  release:
    name: release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: archive-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: images
      - name: Check the tag names the built version
        run: |
          for target in x86_64-unknown-linux-musl aarch64-unknown-linux-musl aarch64-apple-darwin; do
            test -f "dist/acyclic-${TAG#v}-$target.tar.gz"
          done
      # release-please leaves a draft with the changelog as its notes; a tag pushed by hand has none.
      - name: Fill the draft release, or create one
        run: |
          (cd dist && sha256sum -- *.tar.gz > SHA256SUMS)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" --clobber dist/*
          else
            gh release create "$TAG" --draft --verify-tag --title "$TAG" --notes "acyclic $TAG. The server's image is $IMAGE:$TAG." dist/*
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Push the image
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | skopeo login ghcr.io --username "$ACTOR" --password-stdin
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          sh scripts/publish-image.sh "$IMAGE" "$TAG" images
      - name: Publish the release
        run: gh release edit "$TAG" --draft=false --latest

  verify:
    name: verify ${{ matrix.arch }}
    needs: release
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, runner: ubuntu-24.04 }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    permissions:
      packages: read
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Run the published image on this architecture
        env:
          ACTOR: ${{ github.actor }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker run --rm "$IMAGE:$TAG" --version | tee /dev/stderr | grep -qx "acyclic ${TAG#v}"
      # The README's install command, against the release just published.
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - name: Install the release with mise
        run: mise exec "github:iExalt/acyclic@${TAG#v}" -- acyclic --version | tee /dev/stderr | grep -qx "acyclic ${TAG#v}"
