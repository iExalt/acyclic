name: Native builder validation

on:
  pull_request:
    paths:
      - .github/workflows/native-builder.yml
      - containers/ci-native/**
      - scripts/ci/native-*
      - scripts/build-ci-image.sh
      - scripts/validate-ci-image.py
      - scripts/with-ci-buildkit.sh
      - scripts/ci-image-test.py
      - mise.toml

permissions:
  contents: read

concurrency:
  group: native-builder-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  native:
    name: native builder ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux/amd64, runner: ubuntu-24.04 }
          - { platform: linux/arm64, runner: ubuntu-24.04-arm }
    steps:
      - name: Initialize fail-closed host receipt
        timeout-minutes: 2
        env:
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          NATIVE_PLATFORM: ${{ matrix.platform }}
          NATIVE_RUNNER: ${{ matrix.runner }}
        run: |
          mkdir -p "$RUNNER_TEMP/native-host"
          printf '%s\n' '{"schema_version":1,"ready":false,"candidate_ready":false,"collection_status":"failed","diagnostic_exit":1,"blockers":["initialization incomplete"]}' > "$RUNNER_TEMP/native-host/receipt.json"
          python3 - "$RUNNER_TEMP/native-host/receipt.json" <<'PY'
          import datetime
          import json
          import os
          import pathlib
          import re
          import sys

          def observed(value, pattern, reason):
              if value and re.fullmatch(pattern, value):
                  return {"state": "OBSERVED", "value": value, "reason": reason}
              return {"state": "UNKNOWN", "value": None, "reason": "identity unavailable or unsafe"}

          fields = {
              "event_head_sha": observed(os.getenv("EVENT_HEAD_SHA"), r"[0-9a-f]{40}", "immutable PR event head"),
              "event_base_sha": observed(os.getenv("EVENT_BASE_SHA"), r"[0-9a-f]{40}", "immutable PR event base"),
              "workflow_ref": observed(os.getenv("GITHUB_WORKFLOW_REF"), r"iExalt/acyclic/.github/workflows/native-builder.yml@refs/pull/[0-9]+/merge", "workflow ref"),
              "workflow_sha": observed(os.getenv("GITHUB_WORKFLOW_SHA"), r"[0-9a-f]{40}", "workflow commit"),
              "run_id": observed(os.getenv("GITHUB_RUN_ID"), r"[0-9]+", "run ID"),
              "run_attempt": observed(os.getenv("GITHUB_RUN_ATTEMPT"), r"[0-9]+", "run attempt"),
              "logical_job": {"state": "OBSERVED", "value": "native", "reason": "workflow job key"},
              "matrix_architecture": observed(os.getenv("NATIVE_PLATFORM"), r"linux/(amd64|arm64)", "matrix platform"),
              "runner_label": observed(os.getenv("NATIVE_RUNNER"), r"ubuntu-24.04(-arm)?", "matrix runner"),
              "runner_image_os": observed(os.getenv("ImageOS"), r"ubuntu[0-9.]*", "runner image OS"),
              "runner_image_version": observed(os.getenv("ImageVersion"), r"[0-9.]+", "runner image version"),
              "checkout_sha": {"state": "UNKNOWN", "value": None, "reason": "checkout not completed"},
              "native_architecture": {"state": "UNKNOWN", "value": None, "reason": "host inventory not completed"},
          }
          receipt = {
              "schema_version": 1,
              "collected_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "fields": fields,
              "collection_status": "failed",
              "candidate_ready": False,
              "ready": False,
              "diagnostic_exit": 1,
              "blockers": ["host collection incomplete", "diagnostic-only revision"],
          }
          pathlib.Path(sys.argv[1]).write_text(json.dumps(receipt, sort_keys=True) + "\n")
          PY
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        timeout-minutes: 5
        with:
          persist-credentials: false
      - name: Collect read-only host prerequisites
        if: always()
        timeout-minutes: 4
        run: |
          if test -f scripts/ci/native-host-prereqs.py; then
            if timeout --signal=TERM --kill-after=5s 180s python3 scripts/ci/native-host-prereqs.py "$RUNNER_TEMP/native-host/receipt.json"; then
              result=0
            else
              result=$?
            fi
            echo "diagnostic collector exit: $result"
          else
            echo 'host collector unavailable; UNKNOWN receipt retained' >&2
          fi
          exit 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        timeout-minutes: 5
        with:
          name: native-builder-${{ strategy.job-index }}
          if-no-files-found: error
          path: ${{ runner.temp }}/native-host/receipt.json
