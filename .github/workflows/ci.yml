name: CI

# Every pull request, where its four checks must pass before a merge, and every push to main.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request replaces its running checks; every push to main is checked.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The checks need only Rust, nextest, Gitleaks, rumdl, actionlint and ShellCheck; skip the rest of mise.toml's tools.
  MISE_DISABLE_TOOLS: python,uv,ruff,cargo:cargo-edit,cargo:cargo-generate,podman,github:EmbarkStudios/cargo-about,node,pnpm

jobs:
  check:
    name: mise run check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace/acyclic-cli/assets/graph
          key: graph-renderers-${{ hashFiles('scripts/vendor-graph.pins') }}
      - run: mise run check

  integration:
    name: mise run check:integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace/acyclic-cli/assets/graph
          key: graph-renderers-${{ hashFiles('scripts/vendor-graph.pins') }}
      - run: mise run check:integration

  app:
    name: mise run check:app
    runs-on: ubuntu-latest
    env:
      # The app's check needs only Node and pnpm.
      MISE_DISABLE_TOOLS: rust,python,uv,ruff,cargo:cargo-edit,cargo:cargo-generate,github:nextest-rs/nextest,aqua:gitleaks/gitleaks,podman,aqua:rvben/rumdl,github:EmbarkStudios/cargo-about,aqua:rhysd/actionlint,aqua:koalaman/shellcheck
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      - id: pnpm
        run: echo "store=$(pnpm --dir workspace/acyclic-app store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('workspace/acyclic-app/pnpm-lock.yaml') }}
      - run: mise run check:app

  browser:
    name: mise run check:browser
    # Pinned: the pinned Playwright's WebKit links the ICU 24.04 ships, which ubuntu-latest's newer image lacks.
    runs-on: ubuntu-24.04
    env:
      # Python and uv run Playwright here, and Node and pnpm build the app.
      MISE_DISABLE_TOOLS: ruff,cargo:cargo-edit,cargo:cargo-generate,podman,github:EmbarkStudios/cargo-about
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
      # A cache of its own, holding only the journeys profile the check builds, not the dev build an older cache had.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: browser-journeys
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: workspace/acyclic-cli/assets/graph
          key: graph-renderers-${{ hashFiles('scripts/vendor-graph.pins') }}
      - id: pnpm
        run: echo "store=$(pnpm --dir workspace/acyclic-app store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.pnpm.outputs.store }}
          key: pnpm-${{ runner.os }}-${{ hashFiles('workspace/acyclic-app/pnpm-lock.yaml') }}
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-1.64.0-${{ runner.os }}
      # A stuck apt mirror fails the job here, rather than holding it for hours.
      - run: mise run deps:browser
        timeout-minutes: 5
      - run: mise run check:browser
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: graph-screenshots
          path: target/browser/
