name: Build

# Builds the release binaries and the server's image, and rehearses publishing the image into a throwaway registry.
# Every pull request runs it, and `build ok` is the check that must pass before a merge. Pushes to main run it too, so
# pull requests and tags start from main's caches. publish.yml calls it to build the tagged commit it publishes.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - Containerfile
      - LICENSE
      - THIRD_PARTY.md
      - mise.toml
      - workspace/**
      - scripts/notices.sh
      - scripts/notices/**
      - scripts/publish-image.sh
      - .github/workflows/build.yml
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build
        type: string
        required: true
      skip-rehearsal:
        description: Skip rehearsing the image's publication
        type: boolean
        default: false

permissions:
  contents: read

# A newer push to a pull request replaces its running build. A called run takes the caller's github context, so it
# gets a group of its own that can't collide with the caller's.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The build needs only Rust and cargo-about, and Node and pnpm for the app.
  MISE_DISABLE_TOOLS: python,uv,ruff,cargo:cargo-edit,cargo:cargo-generate,github:nextest-rs/nextest,aqua:gitleaks/gitleaks,aqua:rvben/rumdl,aqua:rhysd/actionlint,aqua:koalaman/shellcheck

jobs:
  # The Linux builds, which the images need. The macOS build is a job of its own, so that the images and the rehearsal
  # start once these finish, without waiting for it.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    env:
      TARGET: ${{ matrix.target }}
      ACYCLIC_REQUIRE_APP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: ./.github/actions/build-archive
        with:
          target: ${{ matrix.target }}

  build-macos:
    name: build aarch64-apple-darwin
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      ACYCLIC_REQUIRE_APP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - run: exit 1

  image:
    name: image ${{ matrix.arch }}
    needs: build
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: archive-${{ matrix.target }}
          path: dist
      - name: Stage the binary and the notices
        run: |
          tar -xzf dist/acyclic-*.tar.gz -C dist
          mkdir -p "dist/$ARCH"
          mv dist/acyclic-*/acyclic "dist/$ARCH/acyclic"
          mv dist/acyclic-*/THIRD_PARTY_NOTICES.md dist/
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the archive, and run it on this architecture
        run: |
          docker buildx build --platform "linux/$ARCH" --provenance=false --output "type=oci,dest=image-$ARCH.tar" --file Containerfile .
          skopeo copy --all "oci-archive:image-$ARCH.tar" docker-daemon:acyclic-server:test
          docker run --rm acyclic-server:test --version
          if docker run --rm --entrypoint git acyclic-server:test --version >/dev/null 2>&1; then echo "the image holds git" >&2; exit 1; fi
          test "$(docker run --rm --entrypoint id acyclic-server:test -u)" != 0
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          if-no-files-found: error

  rehearse:
    name: rehearse publishing
    # Outside a call the input is null, and `!null` is true, so pull requests and pushes rehearse.
    if: ${{ !inputs.skip-rehearsal }}
    needs: image
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - run: sh scripts/publish-image.sh localhost:5000/acyclic-server rehearsal images --dest-tls-verify=false
      - name: Check the index holds both architectures and runs here
        run: |
          docker buildx imagetools inspect localhost:5000/acyclic-server:rehearsal
          docker buildx imagetools inspect localhost:5000/acyclic-server:rehearsal --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform.architecture] | sort == ["amd64", "arm64"]'
          docker run --rm localhost:5000/acyclic-server:rehearsal --version

  # The one check a merge requires, so the requirement survives changes to the matrix. A skipped job would count as
  # passing, so this fails unless every job succeeded, or the rehearsal was skipped because the caller asked.
  ok:
    name: build ok
    if: ${{ !cancelled() }}
    needs: [build, build-macos, image, rehearse]
    runs-on: ubuntu-24.04
    env:
      BUILD: ${{ needs.build.result }}
      BUILD_MACOS: ${{ needs.build-macos.result }}
      IMAGE: ${{ needs.image.result }}
      REHEARSE: ${{ needs.rehearse.result }}
      SKIP_REHEARSAL: ${{ inputs.skip-rehearsal == true }}
    steps:
      - run: |
          echo "build: $BUILD, macOS build: $BUILD_MACOS, image: $IMAGE, rehearse: $REHEARSE"
          test "$BUILD" = success
          test "$BUILD_MACOS" = success
          test "$IMAGE" = success
          test "$REHEARSE" = success || { test "$SKIP_REHEARSAL" = true && test "$REHEARSE" = skipped; }
