name: Build

# Builds the release binaries and the server's image, and rehearses publishing the image into a throwaway registry.
# CI calls it for pull requests and main; publish.yml calls it for the tagged source.
# The x86 job shares its frontend before compiling Rust, while the other jobs prepare independently.
on:
  workflow_call:
    inputs:
      ref:
        description: The commit or tag to build
        type: string
        required: true
      reuse-notices:
        description: Reuse crate notices for the ordinary CI caller
        type: boolean
        default: false
      skip-rehearsal:
        description: Skip rehearsing the image's publication
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

# A newer push to a pull request replaces its running build. A called run takes the caller's github context, so it
# gets a group of its own that can't collide with the caller's.
concurrency:
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # The build needs only Rust and cargo-about, and Node and pnpm for the app.
  MISE_DISABLE_TOOLS: python,uv,ruff,cargo:cargo-edit,cargo:cargo-generate,github:nextest-rs/nextest,aqua:gitleaks/gitleaks,aqua:rvben/rumdl,aqua:rhysd/actionlint,aqua:koalaman/shellcheck

jobs:
  # Each native Linux job owns its archive and image; the rehearsal need not wait for the macOS archive.
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - { arch: amd64, target: x86_64-unknown-linux-musl, runner: ubuntu-24.04 }
          - { arch: arm64, target: aarch64-unknown-linux-musl, runner: ubuntu-24.04-arm }
    env:
      TARGET: ${{ matrix.target }}
      ARCH: ${{ matrix.arch }}
      ACYCLIC_REQUIRE_APP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: rust node pnpm github:EmbarkStudios/cargo-about
      - name: Require defining workflow identity
        id: tooling
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repository=$(jq -er '.workflow_repository | select(type == "string")' <<< "$JOB_CONTEXT")
          revision=$(jq -er '.workflow_sha | select(type == "string")' <<< "$JOB_CONTEXT")
          [[ "$repository" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.revision }}
          path: .build-tooling
          persist-credentials: false
      - uses: ./.build-tooling/.github/actions/build-archive
        env:
          FRONTEND_TOOLING_REPOSITORY: ${{ steps.tooling.outputs.repository }}
          FRONTEND_TOOLING_SHA: ${{ steps.tooling.outputs.revision }}
        with:
          target: ${{ matrix.target }}
          frontend-producer: ${{ matrix.arch == 'amd64' }}
          # A build that publishes (publish.yml calls this workflow with a ref) generates the notices afresh.
          reuse-notices: ${{ inputs.ref == '' || inputs.reuse-notices == true }}

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image from this archive, and run it on this architecture
        run: |
          context=$(mktemp -d "$RUNNER_TEMP/acyclic-oci.XXXXXX")
          cleanup() {
            result=$?
            trap - EXIT
            if ! rm -r -- "$context"; then
              echo "could not remove the image build context" >&2
              if test "$result" -eq 0; then result=1; fi
            fi
            exit "$result"
          }
          trap cleanup EXIT
          shopt -s nullglob
          binaries=(dist/acyclic-*/acyclic)
          test "${#binaries[@]}" -eq 1
          binary=${binaries[0]}
          package=$(dirname "$binary")
          notices="$package/THIRD_PARTY_NOTICES.md"
          [[ -d dist && ! -L dist && -d "$package" && ! -L "$package" ]]
          [[ -f "$binary" && ! -L "$binary" && -f "$notices" && ! -L "$notices" ]]
          [[ -f Containerfile && ! -L Containerfile && -f LICENSE && ! -L LICENSE ]]
          mkdir -p "$context/dist/$ARCH"
          cp Containerfile LICENSE "$context/"
          cp "$binary" "$context/dist/$ARCH/acyclic"
          cp "$notices" "$context/dist/THIRD_PARTY_NOTICES.md"
          docker buildx build --platform "linux/$ARCH" --provenance=false --output "type=oci,dest=image-$ARCH.tar" --file "$context/Containerfile" "$context"
          skopeo copy --all "oci-archive:image-$ARCH.tar" docker-daemon:acyclic-server:test
          docker run --rm acyclic-server:test --version
          docker run --rm --entrypoint sh acyclic-server:test -c '! command -v git'
          uid=$(docker run --rm --entrypoint id acyclic-server:test -u)
          [[ "$uid" =~ ^[1-9][0-9]*$ ]]
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.arch }}
          path: image-${{ matrix.arch }}.tar
          if-no-files-found: error

  build-macos:
    name: build aarch64-apple-darwin
    runs-on: macos-15
    env:
      TARGET: aarch64-apple-darwin
      ACYCLIC_REQUIRE_APP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: jdx/mise-action@08ae2a091c038e1e05ec6f5115dc5c69d5a2a6b8 # v5.1.2
        with:
          install_args: rust node pnpm github:EmbarkStudios/cargo-about
      - name: Require defining workflow identity
        id: tooling
        env:
          JOB_CONTEXT: ${{ toJSON(job) }}
        run: |
          repository=$(jq -er '.workflow_repository | select(type == "string")' <<< "$JOB_CONTEXT")
          revision=$(jq -er '.workflow_sha | select(type == "string")' <<< "$JOB_CONTEXT")
          [[ "$repository" =~ ^[a-zA-Z0-9_.-]+/[a-zA-Z0-9_.-]+$ ]]
          [[ "$revision" =~ ^[0-9a-f]{40}$ ]]
          echo "repository=$repository" >> "$GITHUB_OUTPUT"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ steps.tooling.outputs.repository }}
          ref: ${{ steps.tooling.outputs.revision }}
          path: .build-tooling
          persist-credentials: false
      - uses: ./.build-tooling/.github/actions/build-archive
        env:
          FRONTEND_TOOLING_REPOSITORY: ${{ steps.tooling.outputs.repository }}
          FRONTEND_TOOLING_SHA: ${{ steps.tooling.outputs.revision }}
        with:
          target: aarch64-apple-darwin
          reuse-notices: ${{ inputs.ref == '' || inputs.reuse-notices == true }}

  rehearse:
    name: rehearse publishing
    # Outside a call the input is null, and `!null` is true, so pull requests and pushes rehearse.
    if: ${{ !inputs.skip-rehearsal }}
    needs: build
    runs-on: ubuntu-24.04
    services:
      registry:
        image: registry:2
        ports: ["5000:5000"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          merge-multiple: true
          path: images
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: network=host
      - run: sh scripts/publish-image.sh localhost:5000/acyclic-server rehearsal images --dest-tls-verify=false
      - name: Check the index holds both architectures and runs here
        run: |
          docker buildx imagetools inspect localhost:5000/acyclic-server:rehearsal
          docker buildx imagetools inspect localhost:5000/acyclic-server:rehearsal --format '{{json .Manifest}}' \
            | jq -e '[.manifests[].platform.architecture] | sort == ["amd64", "arm64"]'
          docker run --rm localhost:5000/acyclic-server:rehearsal --version

  # The one check a merge requires, so the requirement survives changes to the matrix. A skipped job would count as
  # passing, so this fails unless every job succeeded, or the rehearsal was skipped because the caller asked.
  ok:
    name: build ok
    if: ${{ always() }}
    needs: [build, build-macos, rehearse]
    runs-on: ubuntu-24.04
    env:
      BUILD: ${{ needs.build.result }}
      BUILD_MACOS: ${{ needs.build-macos.result }}
      REHEARSE: ${{ needs.rehearse.result }}
      SKIP_REHEARSAL: ${{ inputs.skip-rehearsal == true }}
    steps:
      - run: |
          echo "build: $BUILD, macOS build: $BUILD_MACOS, rehearse: $REHEARSE"
          test "$BUILD" = success
          test "$BUILD_MACOS" = success
          test "$REHEARSE" = success || { test "$SKIP_REHEARSAL" = true && test "$REHEARSE" = skipped; } || exit 1
