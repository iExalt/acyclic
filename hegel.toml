# Property tests run 256 cases in the routine check, locally and on CI, or 128 for a test whose cases cost more;
# `mise run check:properties` runs them at scale through HEGEL_TEST_CASES, which overrides every profile here.

[profiles.common]
extends = "base"
test_cases = 256

[profiles.development]
extends = "common"

[profiles.ci]
extends = "common"

# For a test whose cases cost more.
[profiles.light]
test_cases = 128
