[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }
python = "3.15.0"
uv = "0.13.1"
ruff = "0.17.0"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-generate" = "0.25.0"
# A prebuilt release: installing through cargo compiles it, which took most of a CI job.
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }
# The pre-push guard's secret scanner.
"aqua:gitleaks/gitleaks" = "8.30.1"
# Podman runs agent containers on macOS; gvproxy and vfkit, pinned below, are its machine's helpers.
podman = { version = "6.1.4", os = ["macos"] }
"aqua:rvben/rumdl" = "0.2.79"
# Collects the Rust crates' licences for the release's notices.
"github:EmbarkStudios/cargo-about" = "0.9.2"
# Lints the workflows, with ShellCheck for their scripts.
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
# Podman's machine helpers at the versions its 6.1.4 installer bundles; the vfkit release is signed with the
# virtualization entitlement the applehv provider needs.
"github:containers/gvisor-tap-vsock" = { version = "0.9.0", asset_pattern = "gvproxy-darwin", bin = "gvproxy", os = ["macos"] }
"github:crc-org/vfkit" = { version = "0.6.4", asset_pattern = "vfkit", bin = "vfkit", os = ["macos"] }

[tasks.check]
description = "Routine check: format, Clippy and every crate's unit tests (budget: 60 seconds on a warm cache)"
depends = ["vendor:graph"]
env = { ACYCLIC_REQUIRE_ASSETS = "1" }
run = [
  # Outside CI, a clone without the pre-push guard fails the check, so it never pushes unguarded.
  '[ -n "${CI:-}" ] || [ "$(git config core.hooksPath)" = .githooks ] || { echo "the pre-push guard is not installed: run mise run hooks:install" >&2; exit 1; }',
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  # The pinned nextest by path: cargo would otherwise prefer any copy in ~/.cargo/bin.
  '"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run --workspace --lib --bins --locked --no-tests=pass',
  "sh scripts/check-doc-fences.sh",
  "rumdl check .",
  "actionlint",
]

[tasks."check:integration"]
description = "Integration tests (budget: 3 minutes)"
depends = ["vendor:graph"]
env = { ACYCLIC_REQUIRE_ASSETS = "1" }
run = '''"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run --workspace --test '*' --locked --no-tests=pass'''

[tasks."check:properties"]
description = "The core's unit tests with every property test at 20,000 cases (about 40 seconds); not part of any check"
env = { HEGEL_TEST_CASES = "20000" }
run = '''"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run -p acyclic-core --lib --locked'''

[tasks."bench:store"]
description = "Times the binary against trackers of several sizes; not part of any check"
depends = ["vendor:graph"]
env = { ACYCLIC_REQUIRE_ASSETS = "1" }
run = "cargo bench --quiet --locked -p acyclic --bench store --"

[tasks."bench:store:phases"]
description = "Like bench:store, with timing marks splitting each command into phases"
depends = ["vendor:graph"]
env = { ACYCLIC_REQUIRE_ASSETS = "1" }
run = "cargo bench --quiet --locked -p acyclic --features probe --bench store --"

[tasks."check:browser"]
description = "Draws graph pages in headless Chromium and WebKit with the network blocked; downloads Playwright's browsers"
depends = ["vendor:graph"]
env = { ACYCLIC_REQUIRE_ASSETS = "1" }
run = [
  "cargo build --quiet --locked -p acyclic -p acyclic-fixtures",
  # CI sets PLAYWRIGHT_DEPS=--with-deps for the browsers' system libraries.
  "uv run --no-project --with playwright==1.64.0 python -m playwright install ${PLAYWRIGHT_DEPS:-} chromium webkit",
  "uv run --no-project --with playwright==1.64.0 python workspace/acyclic-cli/tests/browser/graph.py target/debug/acyclic target/debug/acyclic-fixtures",
]

[tasks."vendor:graph"]
description = "Fetch the graph page's renderers, pinned by SHA-256, into the CLI's git-ignored assets"
run = "sh scripts/vendor-graph.sh"

[tasks.notices]
description = "Write the release's third-party notices to the path given: THIRD_PARTY.md and the Rust crates' licences"
run = "sh scripts/notices.sh"

[tasks.install]
description = "Install the acyclic CLI from this checkout into ~/.cargo/bin"
depends = ["vendor:graph"]
env = { ACYCLIC_REQUIRE_ASSETS = "1" }
run = "cargo install --locked --path workspace/acyclic"

[tasks."hooks:install"]
description = "Install the pre-push guard for this clone"
run = "git config core.hooksPath .githooks"

[env]
# Podman on macOS fails at startup when XDG_RUNTIME_DIR names a directory that doesn't exist, as a Linux-style
# /run/user/<uid> does; unset, it keeps its sockets under the macOS temporary directory.
XDG_RUNTIME_DIR = false
# Podman's machine uses Apple's hypervisor through vfkit, which it finds on PATH; gvproxy it finds only in its helper
# directories, so point it at mise's copy.
CONTAINERS_MACHINE_PROVIDER = "applehv"
CONTAINERS_HELPER_BINARY_DIR = { value = "{{ exec(command='d=$(command -v gvproxy) && dirname \"$d\" || true') }}", tools = true }
# Keep uv project environments outside the checkout so repository moves do not relocate them.
UV_PROJECT_ENVIRONMENT = "{{ env.HOME }}/.virtualenvs/{{ config_root | basename }}"
# Create and activate a seeded central environment so Python and pip both resolve inside it.
_.python.venv = { path = "{{ env.HOME }}/.virtualenvs/{{ config_root | basename }}", create = true, uv_create_args = ["--seed"] }

[settings]
# Disable Mise auto-venv creation, which can recreate a checkout-local .venv.
python.uv_venv_auto = false
