[tools]
rust = { version = "1.98.1", components = "rustfmt,clippy" }
python = "3.14.7"
uv = "0.12.13"
ruff = "0.16.7"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-generate" = "0.24.0"
# A prebuilt release: installing through cargo compiles it, which took most of a CI job.
"github:nextest-rs/nextest" = { version = "0.9.144", version_prefix = "cargo-nextest-" }
# The pre-push guard's secret scanner.
"aqua:gitleaks/gitleaks" = "8.30.1"
# Podman runs agent containers on macOS; its machine helpers arrive with the Podman executor.
podman = { version = "6.1.4", os = ["macos"] }

[tasks.check]
description = "Routine check: format, Clippy and every crate's unit tests (budget: 60 seconds on a warm cache)"
run = [
  # Outside CI, a clone without the pre-push guard fails the check, so it never pushes unguarded.
  '[ -n "${CI:-}" ] || [ "$(git config core.hooksPath)" = .githooks ] || { echo "the pre-push guard is not installed: run mise run hooks:install" >&2; exit 1; }',
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  # The pinned nextest by path: cargo would otherwise prefer any copy in ~/.cargo/bin.
  '"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run --workspace --lib --bins --locked --no-tests=pass',
  "sh scripts/check-doc-fences.sh",
]

[tasks."check:integration"]
description = "Integration tests (budget: 3 minutes)"
run = '''"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run --workspace --test '*' --locked --no-tests=pass'''

[tasks."hooks:install"]
description = "Install the pre-push guard for this clone"
run = "git config core.hooksPath .githooks"

[env]
# Keep uv project environments outside the checkout so repository moves do not relocate them.
UV_PROJECT_ENVIRONMENT = "{{ env.HOME }}/.virtualenvs/{{ config_root | basename }}"
# Create and activate a seeded central environment so Python and pip both resolve inside it.
_.python.venv = { path = "{{ env.HOME }}/.virtualenvs/{{ config_root | basename }}", create = true, uv_create_args = ["--seed"] }

[settings]
# Disable Mise auto-venv creation, which can recreate a checkout-local .venv.
python.uv_venv_auto = false
