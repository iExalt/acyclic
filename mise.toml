[tools]
rust = { version = "1.99.0", components = "rustfmt,clippy" }
python = "3.15.0"
uv = "0.13.1"
ruff = "0.17.0"
"cargo:cargo-edit" = "0.13.13"
"cargo:cargo-generate" = "0.25.0"
# A prebuilt release: installing through cargo compiles it, which took most of a CI job.
"github:nextest-rs/nextest" = { version = "0.9.148", version_prefix = "cargo-nextest-" }
# The pre-push guard's secret scanner.
"aqua:gitleaks/gitleaks" = "8.30.1"
"aqua:rvben/rumdl" = "0.2.79"
# Collects the Rust crates' licences for the release's notices.
"github:EmbarkStudios/cargo-about" = "0.9.2"
# Lints the workflows, with ShellCheck for their scripts.
"aqua:rhysd/actionlint" = "1.7.12"
"aqua:koalaman/shellcheck" = "0.11.0"
# The app's toolchain (workspace/acyclic-app); its own dependencies are pinned in its pnpm-lock.yaml.
node = "26.12.1"
pnpm = "12.15.0"

[tasks.check]
description = "Routine check: format, Clippy, every crate's unit tests, and the doc fence, Markdown and workflow lints (budget: 60 seconds on a warm cache)"
run = [
  # Outside CI, a clone without the pre-push guard fails the check, so it never pushes unguarded.
  '[ -n "${CI:-}" ] || [ "$(git config core.hooksPath)" = .githooks ] || { echo "the pre-push guard is not installed: run mise run hooks:install" >&2; exit 1; }',
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --locked -- -D warnings",
  # The pinned nextest by path: cargo would otherwise prefer any copy in ~/.cargo/bin.
  '"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run --workspace --lib --bins --locked --no-tests=pass',
  "sh scripts/check-doc-fences.sh",
  "rumdl check .",
  "actionlint",
]

[tasks."app:install"]
description = "Install the app's dependencies from its lockfile, from pnpm's store when it can"
run = "sh scripts/app-install.sh"

[tasks."check:app"]
description = "The app's check: typecheck, Biome's lint and format, and its unit tests (budget: 20 seconds on a warm cache)"
depends = ["app:install"]
dir = "workspace/acyclic-app"
run = "pnpm run check"

[tasks."build:app"]
description = "Build the app into workspace/acyclic-app/dist, which acyclic-app-assets embeds in the binary"
depends = ["app:install"]
dir = "workspace/acyclic-app"
run = "pnpm exec vite build --logLevel warn"

[tasks."app:dev"]
description = "Serve the app from Vite's dev server, reloading on change, against acyclic up on a fixture tracker; prints the pairing link"
depends = ["app:install"]
run = "sh scripts/app-dev.sh"

[tasks."check:integration"]
description = "Integration tests (budget: 3 minutes)"
run = '''"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run --workspace --test '*' --locked --no-tests=pass'''

[tasks."check:properties"]
description = "The core's unit tests with every property test at 20,000 cases (about 45 seconds); not part of any check"
env = { HEGEL_TEST_CASES = "20000" }
run = '''"$(mise where github:nextest-rs/nextest)/cargo-nextest" nextest run -p acyclic-core --lib --locked'''

[tasks."bench:store"]
description = "Times the binary against trackers of several sizes; not part of any check"
run = "cargo bench --quiet --locked -p acyclic --bench store --"

[tasks."bench:store:phases"]
description = "Like bench:store, with timing marks splitting each command into phases"
run = "cargo bench --quiet --locked -p acyclic --features probe --bench store --"

[tasks."check:browser"]
description = "Drives the app in headless Chromium and WebKit; downloads Playwright's browsers (budget: 3 minutes)"
depends = ["build:app"]
# Unbuffered, so each journey's line reaches CI's log as it finishes, and the log's timestamps time it.
env = { ACYCLIC_REQUIRE_APP = "1", PYTHONUNBUFFERED = "1" }
run = [
  "cargo build --quiet --locked --profile journeys -p acyclic -p acyclic-fixtures",
  "uv run --no-project --with playwright==1.64.0 python -m playwright install chromium webkit",
  "uv run --no-project --with playwright==1.64.0 python workspace/acyclic-app/tests/browser/app.py target/journeys/acyclic target/journeys/acyclic-fixtures",
]

[tasks."deps:browser"]
description = "Install the browsers' system libraries with apt, for check:browser on Linux; CI runs it as its own step, so check:browser's time is the tests'"
run = "uv run --no-project --with playwright==1.64.0 python -m playwright install-deps chromium webkit"

[tasks.notices]
description = "Write the release's third-party notices to the path given: THIRD_PARTY.md and the Rust crates' licences"
run = "sh scripts/notices.sh"

[tasks.install]
description = "Install the acyclic CLI, with the app built in, from this checkout into ~/.cargo/bin"
depends = ["build:app"]
env = { ACYCLIC_REQUIRE_APP = "1" }
run = "cargo install --locked --path workspace/acyclic"

[tasks."hooks:install"]
description = "Install the pre-push guard for this clone"
run = "git config core.hooksPath .githooks"

[env]
# Keep uv project environments outside the checkout so repository moves do not relocate them.
UV_PROJECT_ENVIRONMENT = "{{ env.HOME }}/.virtualenvs/{{ config_root | basename }}"
# Create and activate a seeded central environment so Python and pip both resolve inside it.
_.python.venv = { path = "{{ env.HOME }}/.virtualenvs/{{ config_root | basename }}", create = true, uv_create_args = ["--seed"] }

[settings]
# Disable Mise auto-venv creation, which can recreate a checkout-local .venv.
python.uv_venv_auto = false
