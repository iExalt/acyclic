[workspace]
resolver = "3"
members = ["workspace/*"]
# The app is TypeScript, built by pnpm (mise run build:app).
exclude = ["workspace/template", "workspace/acyclic-app"]

[workspace.package]
version = "0.7.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
acyclic-app-assets = { path = "workspace/acyclic-app-assets" }
acyclic-cli = { path = "workspace/acyclic-cli" }
acyclic-core = { path = "workspace/acyclic-core" }
acyclic-fixtures = { path = "workspace/acyclic-fixtures" }
acyclic-server = { path = "workspace/acyclic-server" }
# HTTP/1 only: Tailscale's proxy speaks it to the server, and HTTP/2 would carry the host outside `Host`.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
# The terminal's width comes from `terminal_size`, so the table needs no terminal library of its own.
comfy-table = { version = "8.0.1", default-features = false }
getrandom = "0.4.3"
# The engine is linked in, so tests need no shared library at run time.
hegeltest = { version = "0.49.8", features = ["static-engine"] }
insta = "1.49.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
terminal_size = "0.4.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "sync"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
# Record ids: v7 makes them from the clock and the system's randomness, and fixtures build them from a seed.
uuid = { version = "1.29.0", default-features = false, features = ["std", "v7"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs", "compression-br", "compression-gzip"] }

# The CLI and server the browser checks drive (mise run check:browser): the journeys wait on every write and read, and
# unoptimised these took about a quarter of the run. Level 1 keeps an incremental build about as quick as dev's; CI,
# which builds the workspace's crates afresh each run, sets it back to 0.
[profile.journeys]
inherits = "dev"
opt-level = 1

# The dependencies, the gix crates among them, run unoptimised in CI, where the line above is set back to 0 for the
# workspace's own crates. Each journey waits on the CLI and server reading, importing and writing, and with the dependencies at
# level 1 the journeys ran in 92 s on four cores where they took 112 s. A cold build of them takes 60 s longer (117 s against 57 s),
# paid only when Cargo.lock changes: the CI cache holds them. Levels 2 and 3 ran no faster (94 and 93 s) and built more slowly.
[profile.journeys.package."*"]
opt-level = 1

# The shipped binary carries gix, with its network and TLS stack. One codegen unit makes the stripped binary 13 to 17% smaller than the
# default's sixteen, and thin LTO on top adds nothing on size. Measured at the pinned Rust on the three release targets, against thin LTO
# with one codegen unit: LTO off made the stripped binary 1.8 to 2.3% smaller (x86_64 musl 26.96 to 26.35 MB), a CLI command on a
# 3,500-item tracker about 1 to 3% slower (a few ms; an import 13 to 18 ms), and a release build after an edit 0.50 to 0.66 times as long
# (macOS 117 to 58 s, x86_64 musl 86 to 49 s), which is what a pull request's build waits on. Sixteen codegen units built faster still but
# made it 13 to 18% larger and 10 to 25% slower. Panics stay unwinding, as the server catches those of a task.
[profile.release]
lto = "off"
codegen-units = 1
