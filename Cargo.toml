[workspace]
resolver = "3"
members = ["workspace/*"]
# The app is TypeScript, built by pnpm (mise run build:app).
exclude = ["workspace/template", "workspace/acyclic-app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
acyclic-app-assets = { path = "workspace/acyclic-app-assets" }
acyclic-cli = { path = "workspace/acyclic-cli" }
acyclic-core = { path = "workspace/acyclic-core" }
acyclic-fixtures = { path = "workspace/acyclic-fixtures" }
acyclic-guard = { path = "workspace/acyclic-guard" }
acyclic-operator = { path = "workspace/acyclic-operator" }
acyclic-secrets = { path = "workspace/acyclic-secrets" }
acyclic-server = { path = "workspace/acyclic-server" }
# HTTP/1 only: Tailscale's proxy speaks it to the server, and HTTP/2 would carry the host outside `Host`.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
clap = { version = "4.6.7", features = ["derive", "string"] }
clap_complete = "4.6.11"
# The terminal's width comes from `terminal_size`, so the table needs no terminal library of its own.
comfy-table = { version = "8.0.1", default-features = false }
# Run tokens are signed with Ed25519, so a server can check them without being able to mint them.
ed25519-dalek = "3.0.0"
flate2 = "1.1.5"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
# The engine is linked in, so tests need no shared library at run time.
hegeltest = { version = "0.49.8", features = ["static-engine"] }
insta = "1.49.0"
libc = "0.2.190"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
terminal_size = "0.4.4"
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "signal", "time", "process", "io-util", "sync"] }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
tower = { version = "0.5.3", default-features = false, features = ["util"] }
tower-http = { version = "0.7.1", default-features = false, features = ["fs", "compression-br", "compression-gzip"] }
zeroize = "1.9.1"
