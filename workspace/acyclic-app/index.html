<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- A phone's keyboard shrinks the page rather than covering it, so a form's actions stay above it. -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <!-- The bar's colour, palette.ts's chrome in each scheme. -->
    <meta name="theme-color" content="#16191d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#eceef1" media="(prefers-color-scheme: light)" />
    <title>acyclic</title>
    <!-- Every file is behind the session's cookie, which the manifest's fetch sends only when asked to. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <!-- Before the first paint: the Theme picked on this device. -->
    <script src="/theme.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
