[package]
name = "acyclic-server"
version.workspace = true
edition.workspace = true
readme = "README.md"
license.workspace = true

[dependencies]
acyclic-app-assets.workspace = true
acyclic-cli.workspace = true
acyclic-core.workspace = true
aes-gcm = "0.11.1"
axum.workspace = true
base64ct = { version = "1.8.3", features = ["alloc"] }
getrandom.workspace = true
hkdf = "0.13.0"
http-body-util = "0.1.5"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["http1", "ring", "native-tokio", "tls12"] }
hyper-util = { version = "0.1.21", features = ["client-legacy", "http1", "tokio"] }
p256 = { version = "0.14.0", default-features = false, features = ["ecdh", "ecdsa", "std"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tower.workspace = true
tower-http.workspace = true

[dev-dependencies]
tempfile.workspace = true
