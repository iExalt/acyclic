<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><!--TITLE--></title>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #fff; color: #222; }
  #graph { position: fixed; inset: 0; }
  #graph svg { width: 100%; height: 100%; cursor: grab; touch-action: none; }
  #status { position: fixed; top: 8px; left: 8px; color: #666; }
  body[data-state="done"] #status { display: none; }
  #error { position: fixed; top: 32px; left: 8px; right: 8px; color: #a00; white-space: pre-wrap; }
  #legend { position: fixed; bottom: 8px; left: 8px; background: #fffe; border: 1px solid #ddd; border-radius: 4px;
            padding: 6px 8px; }
  #legend div { display: flex; align-items: center; gap: 6px; }
</style>
</head>
<body data-state="loading" data-renderer="<!--RENDERER-->">
<div id="graph"></div>
<div id="status">Drawing…</div>
<div id="error"></div>
<div id="legend" aria-label="Legend">
  <div><svg width="36" height="10"><line x1="0" y1="5" x2="36" y2="5" stroke="#bbb"/></svg>parent and child</div>
  <div><svg width="36" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#222"/><path d="M30 1 L36 5 L30 9 Z" fill="#222"/></svg>blocks: must finish first</div>
  <div><svg width="36" height="10"><line x1="0" y1="5" x2="30" y2="5" stroke="#222" stroke-dasharray="4 3"/><path d="M30 1 L36 5 L30 9 Z" fill="#222"/></svg>after: preferably first</div>
  <div><svg width="36" height="10"><line x1="0" y1="5" x2="36" y2="5" stroke="#222" stroke-dasharray="1 3"/></svg>relates</div>
  <div><svg width="36" height="14"><rect x="1" y="1" width="34" height="12" rx="3" fill="none" stroke="#888" stroke-dasharray="3 2"/></svg>outside this view</div>
</div>
<script id="source" type="application/json"><!--SOURCE--></script>
<!--LIBRARY-->
<script type="module">
(async () => {
  const body = document.body;
  const started = performance.now();
  const source = JSON.parse(document.getElementById('source').textContent);
  try {
    let svg;
    if (body.dataset.renderer === 'graphviz') {
      svg = (await globalThis.acyclicGraphviz.load()).dot(source);
    } else {
      mermaid.initialize({
        startOnLoad: false,
        securityLevel: 'strict',
        htmlLabels: true,
        flowchart: { htmlLabels: true },
        maxTextSize: source.length + 1,
        maxEdges: 1000000,
      });
      ({ svg } = await mermaid.render('acyclic-graph', source));
    }
    const graph = document.getElementById('graph');
    graph.innerHTML = svg;
    panZoom(graph.querySelector('svg'));
    // From navigation, so it counts loading the renderer too; the render alone is data-render-ms.
    body.dataset.ms = String(Math.round(performance.now()));
    body.dataset.renderMs = String(Math.round(performance.now() - started));
    body.dataset.state = 'done';
  } catch (error) {
    document.getElementById('error').textContent = String((error && error.message) || error);
    body.dataset.state = 'error';
  }
})();

// Wheel zooms around the pointer and dragging pans, by moving the SVG's view box.
function panZoom(svg) {
  const box = svg.viewBox.baseVal;
  let x = box.x, y = box.y, w = box.width, h = box.height;
  if (!w || !h) ({ x, y, width: w, height: h } = svg.getBBox());
  svg.removeAttribute('width');
  svg.removeAttribute('height');
  svg.style.maxWidth = 'none';
  const show = () => svg.setAttribute('viewBox', `${x} ${y} ${w} ${h}`);
  show();
  svg.addEventListener('wheel', (event) => {
    event.preventDefault();
    const rect = svg.getBoundingClientRect();
    const factor = Math.exp(event.deltaY * 0.0015);
    const px = x + ((event.clientX - rect.left) / rect.width) * w;
    const py = y + ((event.clientY - rect.top) / rect.height) * h;
    x = px - (px - x) * factor;
    y = py - (py - y) * factor;
    w *= factor;
    h *= factor;
    show();
  }, { passive: false });
  let drag = null;
  svg.addEventListener('pointerdown', (event) => {
    drag = { cx: event.clientX, cy: event.clientY, x, y };
    svg.setPointerCapture(event.pointerId);
  });
  svg.addEventListener('pointermove', (event) => {
    if (!drag) return;
    const rect = svg.getBoundingClientRect();
    x = drag.x - ((event.clientX - drag.cx) / rect.width) * w;
    y = drag.y - ((event.clientY - drag.cy) / rect.height) * h;
    show();
  });
  svg.addEventListener('pointerup', () => { drag = null; });
}
</script>
</body>
</html>
