[package]
name = "acyclic-core"
version.workspace = true
edition.workspace = true
readme = "README.md"
license.workspace = true

[dependencies]
gix = { git = "https://github.com/iExalt/gitoxide", tag = "gitoxide-fork-v0.4.1", default-features = false, features = [
  "sha1", "sha256", "reftable", "zlib-sirocco", "revision", "parallel", "hook", "maintenance",
  "blocking-network-client", "blocking-http-transport-reqwest-rust-tls-ring", "receive", "upload",
] }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
uuid.workspace = true

[features]
# Timing marks for the store benchmark; see `probe`.
probe = []
# Writes past the write judge, for tests that build a state directly. Only dev-dependencies enable it.
fixtures = []

[dev-dependencies]
hegeltest.workspace = true
insta.workspace = true
tempfile.workspace = true
